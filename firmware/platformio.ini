; platformio.ini - compila o firmware do KadettECU para a placa (ESP32 ou Arduino Mega 2560).
;
;   pio run -e esp32dev                     ESP32 em MODO SOMBRA (saídas desabilitadas): o padrão, seguro para bancada
;   pio run -e esp32dev_saidas              ESP32 com as saídas (bicos e bobinas) HABILITADAS
;   pio run -e megaatmega2560               Arduino Mega 2560 em modo sombra
;   pio run -e megaatmega2560_saidas        Arduino Mega 2560 com as saídas habilitadas
;   pio run -e esp32dev -t upload           grava na placa
;   pio device monitor                      (a serial é binária: use o aplicativo Java, não o monitor)
;
; Por que existem dois ambientes por placa: o modo sombra lê tudo, calcula tudo e fala com o aplicativo, mas NÃO
; configura nenhum pino de saída. Ele existe para você validar sensores, rotação e protocolo em bancada e no carro
; (com a ECU original ainda comandando) sem risco. Só use o ambiente "_saidas" depois de ler docs/HARDWARE.md
; e de testar o estágio de potência com o motor desligado.
;
; ATENÇÃO: este arquivo e o código das placas NÃO foram compilados aqui com as cadeias de ferramentas reais
; (xtensa-gcc do ESP32 e avr-gcc do Mega), porque não há acesso ao registro do PlatformIO neste ambiente. O código foi
; verificado no PC contra simuladores das bibliotecas de cada placa (firmware/teste_placas). A primeira compilação de
; verdade pode apontar erros de digitação ou de versão de biblioteca: veja "O que ainda precisa ser validado" em
; docs/HARDWARE.md.

[platformio]
default_envs = esp32dev
; src_dir = src e lib_dir = lib são o padrão do PlatformIO: o núcleo (lib/kecu_core) e o agendador (lib/kecu_sched)
; entram como bibliotecas locais, e src/ tem o main.cpp, a pinagem e a HAL da placa escolhida.

[env]
framework = arduino
monitor_speed = 115200
; Os .c do núcleo seguem o C99; os avisos extras ajudam a pegar erro cedo.
build_flags =
    -Wall
    -Wextra

; ------------------------------------------------------------------ ESP32 (DevKit de 30 ou 38 pinos)
[esp32_comum]
; Arduino-ESP32 2.0.x (o que a plataforma espressif32 6.x traz). A HAL também compila com o Arduino-ESP32 3.x
; (ela escolhe a API de timer/PWM pela versão do núcleo), mas essa combinação foi testada só no simulador.
platform = espressif32@^6.9.0
board = esp32dev
build_flags =
    ${env.build_flags}
    -DKECU_PLACA=1
    ; Os sensores de 5 V entram por divisor 10 k / 10 k (razão 2,0) e a bateria por 47 k / 10 k (razão 5,7): veja a pinagem
    ; e o capítulo de hardware. Se você usar outros resistores, mude estes dois números.
    -DKECU_RAZAO_5V=2.0f
    -DKECU_RAZAO_BATERIA=5.7f

[env:esp32dev]
platform = ${esp32_comum.platform}
board = ${esp32_comum.board}
build_flags =
    ${esp32_comum.build_flags}
    -DKECU_ENABLE_OUTPUTS=0

[env:esp32dev_saidas]
platform = ${esp32_comum.platform}
board = ${esp32_comum.board}
build_flags =
    ${esp32_comum.build_flags}
    -DKECU_ENABLE_OUTPUTS=1
    ; Descomente para a ECU ficar armada assim que ligar (roda sem notebook). Só depois de validar tudo, com extintor à mão:
    ; -DKECU_AUTO_ARMAR=1
    ; Descomente se o seu estágio de potência liga com nível BAIXO no pino (o padrão seguro é nível alto + pull-down):
    ; -DKECU_SAIDA_ATIVA_ALTO=0
    ; Descomente se o carro tem duas bobinas (centelha perdida) em vez de uma com distribuidor:
    ; -DKECU_BOBINAS=2

; ------------------------------------------------------------------ Arduino Mega 2560 (bancada e rotações baixas)
; O Uno e o Nano NÃO servem: 2 KB de RAM não comportam o núcleo.
[mega_comum]
platform = atmelavr
board = megaatmega2560
build_flags =
    ${env.build_flags}
    -DKECU_PLACA=3
    ; O ADC do Mega mede em relação ao AVcc (5 V da USB ou do regulador). MEÇA esse 5 V com um multímetro e ponha o valor
    ; em milivolts aqui (4800 a 5100 é comum): o erro entra direto na leitura da bateria e do NTC.
    -DKECU_VREF_MV=5000
    ; Sensores de 5 V entram direto no pino (razão 1,0). A bateria passa por 20 k / 10 k (razão 3,0: 15 V viram 5 V).
    -DKECU_RAZAO_5V=1.0f
    -DKECU_RAZAO_BATERIA=3.0f
    ; Buffers da serial maiores que os 64 bytes do Arduino: o aplicativo manda quadros de até 248 bytes.
    -DSERIAL_RX_BUFFER_SIZE=256
    -DSERIAL_TX_BUFFER_SIZE=128

[env:megaatmega2560]
platform = ${mega_comum.platform}
board = ${mega_comum.board}
build_flags =
    ${mega_comum.build_flags}
    -DKECU_ENABLE_OUTPUTS=0

[env:megaatmega2560_saidas]
platform = ${mega_comum.platform}
board = ${mega_comum.board}
build_flags =
    ${mega_comum.build_flags}
    -DKECU_ENABLE_OUTPUTS=1
    ; Mesmas opções opcionais do ESP32 (KECU_AUTO_ARMAR, KECU_SAIDA_ATIVA_ALTO, KECU_BOBINAS). No Mega as saídas são
    ; os pinos 22 a 27 (PORTA) e o cão de guarda de 2 s liga junto com elas.
